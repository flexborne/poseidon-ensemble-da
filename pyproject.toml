[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poseidon-da"
version = "0.1.0"
description = "Ensemble Kalman filter / smoother data assimilation for the POSEIDON radionuclide transport model"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander" }]
dependencies = [
    "numpy",
    "scipy",
    "openpyxl",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
poseidon-da = "poseidon_da.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["poseidon_da*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
