# Example case for the bundled Black Sea experiment data.
# Paths are resolved relative to this file's directory.

[case]
schema_version = 1
case_id = "black-sea-cs137"

[dataset]
measurements_dir = "../measurements.exp2"
geometry = "../config/Box_surfareas_with_centers.xlsx"
runs_root = "../DAruns/01.RunKFS"

[analysis]
target_time = "1988.5"
observation_times = ["1988.625", "1988.5"]   # smoother; single entry == filter
gsd = 1.3
bdepths = [25, 100, 500, 2000]

[localization]
horizontal_m = 100000.0
vertical_m = 100.0
temporal_years = 1.0
exclude = [1, 2, 3, 49, 50]

[model]
executable = "../bin/Poseidon4.exe"
launcher = ["wine"]      # on Windows leave empty ([]); on macOS/Linux run via wine
use_pty = true           # POSEIDON is a console Fortran app; headless wine needs a pseudo-terminal

[cycle]
mode = "filter"                                 # noda | filter | smoother
# sequential analysis-forecast date chain (ascending physical time)
dates = ["1986.75", "1987.5", "1988.25", "1988.5", "1988.625", "1988.75", "1988.85", "1990.75", "1991.75"]
window_years = 0.25                             # smoother: +/- window selecting neighbouring dates per analysis
