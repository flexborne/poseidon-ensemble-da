name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        # Data-dependent tests skip automatically when the experiment archive
        # (lastconc.xls files) is not present in the checkout.
        run: pytest -q

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel -o dist .

      - name: Smoke-test the installed wheel from an unrelated directory
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/poseidon-da --version
          /tmp/smoke/bin/python -c "import poseidon_da; print(poseidon_da.__version__)"
